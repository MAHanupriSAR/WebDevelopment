<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <div id="container">
            <form id="login_form">
                <p id="login_text">Login</p>

                <input type="text" id="username_box" name="username" placeholder="Username">

                <input type="password" id="password_box" name="password" placeholder="Password">

                <div id="options">
                    <div id="helper_options">
                        <div id="remember_option">
                            <input type="checkbox" id="remember" name="remember">
                            <label for="remember" id="remember_me_text">Remember me</label>
                        </div>
                        <a id="forgot_pswd_link" href="login.html">Forgot Password?</a>
                    </div>
                    <button id="login_btn">Login</button>
                    <div id="register_btn">
                        <p id="no_acnt_txt">Don't have an account?</p>
                        <a id="register_link" href="login.html">Register</a>
                    </div>
                </div>
                
            </form>
        </div>
    </main>
</body>
</html>

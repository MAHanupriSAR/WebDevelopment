<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <h1>University Registration Form</h1>
        <p>Please fill out the form below</p>
        <hr>

        <form>
            <H2>Personal Details</H2>

            <label for="firstName">First Name</label>
            <input type="text" id="firstName" name="firstName" placeholder="first name" required>
            <br><br>

            <label for="last name">Last name</label>
            <input type="text" id="last name" name="last name" placeholder="last name" required>
            <br><br>

            <label for="dob">D.O.B</label>
            <input type="date" id="dob" name="dob" placeholder="Your Date of Birth" required>
            <br><br>

            <p>Select your gender:</p>
            <label for="male">Male</label>
            <input type="radio" id="male" name="gender">
            <br>
            <label for="female">Female</label>
            <input type="radio" id="female" name="gender">
            <br>
            <label for="other">Other</label>
            <input type="radio" id="other" name="gender">
            <br><br>

            <label>Upload your profile photo</label><br>
            <input type="file" id="profilePhoto" name="profilePhoto">

            <hr>

            <h2>Contact Information</h2>
            
            <label>Email Address</label>
            <input type="email" id="email" name="email" placeholder="enter your email" requiured>
            <br><br>

            <label>Phone Number</label>
            <input type="tel" id="phoneNo" name="phoneNo" placeholder="enter your phone number" requiured>
            <br><br>
            
            <label>Enter your mailing address</label><br>
            <textarea id="address" name="address" placeholder="enter you address"></textarea>
            <br><br>

            <hr>

            <h2>Academic Information</h2>
            <label>Select your course</label>
            <select name="course" id="courseSelection">
                <option value="cse">CSE</option>
                <option value="ce">CE</option>
                <option value="me">ME</option>
            </select>

            <p>Extracurricular Interests</p>
            <label for="sportsLabel">Sports</label>
            <input type="checkbox" id="sportsLabel" name="interests">
            <br>
            <label for="MusicLabel">Music</label>
            <input type="checkbox" id="MusicLabel" name="interests">
            <br>
            <label for="ArtsLabel">Arts</label>
            <input type="checkbox" id="ArtsLabel" name="interests">
            <br>

            <hr>

            <!-- <input type="submit"> -->
            <button type="submit">Submit</button>
            <!-- <input type="reset"> -->
            <button type="reset">Clear Form</button>

        </form>

    </main>
</body>
</html>
